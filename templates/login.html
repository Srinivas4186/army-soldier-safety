<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Army Safety | Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="inner-page">

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="brand">
            <div class="flag">🇮🇳</div>

            <div>
                <h2>ARMY SAFETY</h2>
                <p>Soldier Safety & Emergency Monitoring System</p>
            </div>
        </div>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/login" class="active">
                Login
            </a>

            <a href="/register">
                Register
            </a>

        </div>

        <div class="jai">
            <span></span>
            Jai Hind
            <span></span>
        </div>

    </nav>


    <!-- LOGIN -->

    <main class="form-page">

        <div class="form-card">

            <div class="form-icon">
                🛡️
            </div>

            <p class="form-tag">
                INDIAN ARMY • SECURE ACCESS
            </p>

            <h1>Soldier Login</h1>

            <p class="form-description">
                Access the Soldier Safety Monitoring Dashboard.
            </p>


            <form method="POST">

                <label>Soldier ID</label>

                <input
                    type="text"
                    name="soldier_id"
                    placeholder="Enter Soldier ID"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter Password"
                    required
                >


                <button type="submit" class="form-btn">
                    Login to Dashboard →
                </button>

            </form>


            <p class="form-bottom">
                New soldier?
                <a href="/register">Create an account</a>
            </p>

        </div>

    </main>


    <footer>
        <div>🛡️ Soldier Safety & Emergency Monitoring System</div>
        <div>— For a Safer Tomorrow —</div>
    </footer>

</body>

</html>
